<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>海宁公交线路查询©HNMRXZ</title>
    <style type="text/css">
        /* 变量定义 */
        :root {
            --primary-color: #25A5F7;
            --border-color: #ced4da;
            --text-color: #495057;
            --bg-color: #fff;
            --gray-bg: #e9ecef;
            --shadow-color: rgba(114, 124, 245, .5);
            --border-radius: 0.4rem;
            --spacing-sm: 0.4rem;
            --spacing-md: 0.75rem;
            --spacing-lg: 1rem;
            --font-size-base: 12px;
            --font-size-md: 1rem;
        }

        /* 基础样式重置 */
        * {
            box-sizing: border-box;
        }

        html {
            font-size: var(--font-size-base);
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            color: #111213;
        }

        /* 布局容器 */
        html, body, #container {
            height: 100%;
        }

        /* 组件样式 */
        .input-card {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            border-radius: var(--border-radius);
            box-shadow: 0 2px 6px 0 var(--shadow-color);
            position: fixed;
            bottom: var(--spacing-lg);
            right: var(--spacing-lg);
            padding: var(--spacing-md) var(--spacing-lg);
            min-width: 18rem;
            max-width: 30rem;
            transition: transform 0.3s ease-in-out;
            z-index: 1000;
        }

        .input-card.collapsed {
            transform: translateX(calc(100% - 3rem));
        }

        .collapse-btn {
            position: absolute;
            top: 50%;
            left: -1.5rem;
            transform: translateY(-50%);
            width: 1.5rem;
            height: 3rem;
            background-color: var(--primary-color);
            border: none;
            border-radius: var(--border-radius) 0 0 var(--border-radius);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            transition: background-color 0.2s ease;
            z-index: 1001;
        }

        .collapse-btn:hover {
            background-color: #1a8fe8;
        }

        .collapse-btn::before {
            content: '◀';
            transition: transform 0.3s ease;
        }

        .input-card.collapsed .collapse-btn::before {
            content: '▶';
        }

        .input-item {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            width: 100%;
            margin-bottom: var(--spacing-md);
        }

        .input-item-text {
            width: 6rem;
            padding: var(--spacing-sm) var(--spacing-md);
            background-color: var(--gray-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius) 0 0 var(--border-radius);
            color: var(--text-color);
            text-align: center;
            cursor: pointer;
        }

        .category-header {
            background-color: var(--primary-color);
            color: white;
            border: 1px solid var(--primary-color);
            transition: background-color 0.2s ease;
        }

        .category-header:hover {
            background-color: #1a8fe8;
        }

        /* 表单控件 */
        .btn {
            display: inline-block;
            padding: var(--spacing-sm) var(--spacing-lg);
            font-size: var(--font-size-md);
            font-weight: 400;
            text-align: center;
            white-space: nowrap;
            vertical-align: middle;
            cursor: pointer;
            border: 1px solid var(--primary-color);
            border-radius: var(--border-radius);
            color: var(--primary-color);
            background-color: transparent;
            transition: all 0.15s ease-in-out;
        }

        .btn:hover {
            color: var(--bg-color);
            background-color: var(--primary-color);
        }

        select,
        input[type="text"],
        input[type="date"] {
            display: inline-block;
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            line-height: 1.5;
            color: var(--text-color);
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            transition: border-color 0.15s ease-in-out;
        }

        select:focus,
        input[type="text"]:focus,
        input[type="date"]:focus {
            border-color: var(--primary-color);
            outline: 0;
            box-shadow: 0 0 0 0.1rem rgba(37, 165, 247, 0.1);
        }

        /* 信息窗体 */
        .info {
            padding: var(--spacing-md) var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            background-color: var(--bg-color);
            border-radius: var(--border-radius);
            box-shadow: 0 2px 6px 0 var(--shadow-color);
            position: fixed;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            min-width: 22rem;
        }

        .content-window-card {
            padding: var(--spacing-sm);
        }

        .content-window-card h3 {
            margin: 0 0 var(--spacing-sm);
        }

        .content-window-card p {
            margin: var(--spacing-sm) 0;
        }

        /* 工具类 */
        .text-center {
            text-align: center;
        }

        .mb-1 {
            margin-bottom: var(--spacing-sm);
        }

        .mb-2 {
            margin-bottom: var(--spacing-md);
        }

        .mb-3 {
            margin-bottom: var(--spacing-lg);
        }

        /* Toast提示 */
        .native-toast {
            position: fixed;
            background-color: rgba(50, 50, 50, .8);
            border-radius: 33px;
            color: white;
            left: 50%;
            text-align: center;
            padding: 6px 12px;
            opacity: 0;
            z-index: 99999;
            transition: transform .25s, opacity .25s, top .25s;
        }

        .native-toast-bottom {
            bottom: 50px;
            transform: translateX(-50%) translateY(50px);
        }

        .native-toast-bottom.native-toast-shown {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .native-toast-error { background-color: #d92727; }
        .native-toast-success { background-color: #62a465; }
        .native-toast-warning { background-color: #fdaf17; }
        .native-toast-info { background-color: #5060ba; }

        @media screen and (max-width: 768px) {
            .input-card {
                width: 18rem;
            }
        }
    </style>
</head>
<body>
<div id='container'></div>

<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=1fe93698c8b25bd91836aebb27801b96&plugin=AMap.LineSearch,AMap.DistrictSearch"></script>
<script>
    // 公交线路数据
    const busData = {
        cityBuses: ['游1','2','3','5','6','7','8','9','10','11','12','15','16','17','18','19','20','22','23','25','26','27','28','29','30','31','35','36','37','38','39','91','92','93','96','97','99','918','922'],
        interBuses: [
            {display:'101', value:'101'}, {display:'103', value:'103'}, {display:'105', value:'105'}, {display:'106', value:'106'}, {display:'107', value:'107'},
            {display:'108', value:'108'}, {display:'109', value:'109'}, {display:'113', value:'113'}, {display:'123', value:'123'}, {display:'128', value:'128'},
            {display:'130', value:'130'}, {display:'131', value:'131'}, {display:'181', value:'181'}, {display:'185', value:'185'}, {display:'187', value:'187'},
            {display:'189', value:'189路/K189路'}, {display:'198', value:'198'}, {display:'202', value:'202'}, {display:'203', value:'203'}, {display:'205', value:'205'},
            {display:'206', value:'206'}, {display:'208', value:'208'}, {display:'210', value:'210'}, {display:'212', value:'212'}, {display:'216', value:'216'},
            {display:'218', value:'218'}, {display:'220', value:'220'}, {display:'222', value:'222'}, {display:'225', value:'225'}, {display:'301', value:'301'},
            {display:'302', value:'302'}, {display:'305', value:'305'}, {display:'306', value:'306'}, {display:'308', value:'308'}, {display:'309', value:'309'},
            {display:'310', value:'310'}, {display:'311', value:'311'}, {display:'312', value:'312'}, {display:'313', value:'313'}, 
            {display:'316东', value:'316路东线'}, {display:'316西', value:'316路西线'}, {display:'317', value:'317'}, {display:'318', value:'318'},
            {display:'319', value:'319'}, {display:'320', value:'320'}, {display:'325', value:'325'}, {display:'326', value:'326'}, {display:'330', value:'330'},
            {display:'331', value:'331'}, {display:'332', value:'332'}, {display:'333', value:'333'}, {display:'351', value:'351'}, {display:'353', value:'353'},
            {display:'388', value:'桐乡K388'}, {display:'游2', value:'游2'}, {display:'游3', value:'游3'},
            {display:'临盐线', value:'临平-盐仓专线'}, {display:'临长线1', value:'530'}, {display:'临长线2', value:'531'},
            {display:'九长线', value:'九堡-长安专线'}, {display:'下盐线', value:'868路/K868路区间'}, {display:'财长线', value:'868路/K868路(学院线)'},
            {display:'海盐178', value:'海盐K178路'}, {display:'海盐222', value:'海盐K222路'}, {display:'桐乡329', value:'桐乡K329路'},
            {display:'杭州492', value:'492路'}, {display:'艮盐线', value:'艮山门东至盐仓专线'}, {display:'杭州3101', value:'3101路'},
            {display:'杭州3148', value:'3148路'}, {display:'杭州3185', value:'3185M路'}
        ],
        communityBuses: [
            {display:'长安1', value:'长安社区巴士1号线'}, {display:'长安2', value:'长安社区巴士2号线'}, {display:'长安4', value:'长安社区巴士4号线'},
            {display:'长安5', value:'长安社区巴士5号线'}, {display:'长安6', value:'长安社区巴士6号线'}, {display:'长安-西站', value:'长安-海宁火车西站'},
            {display:'盐仓1', value:'社区巴士盐仓1号线'}, {display:'盐仓2', value:'盐仓社区巴士2号线'}, {display:'盐仓2B', value:'盐仓社区巴士2B号线'},
            {display:'盐仓3', value:'盐仓社区巴士3号线'}, {display:'盐仓5', value:'高新区社区巴士5号线'}, {display:'盐仓5支', value:'高新区社区巴士5号线支线'},
            {display:'许村1', value:'许村社区巴士1号线'}, {display:'许村2', value:'许村社区巴士2号线'}, {display:'许村3', value:'许村社区巴士3号线'},
            {display:'许村4', value:'许村社区巴士4号线'}, {display:'许村5', value:'许村社区巴士5号线'}, {display:'许村Y1', value:'许村社区巴士Y1号线'},
            {display:'袁花1', value:'袁花社区巴士1号线'}, {display:'袁花2', value:'袁花社区巴士2号线'}, {display:'袁花3', value:'袁花社区巴士3号线'},
            {display:'袁花4', value:'袁花社区巴士4号线'}, {display:'袁花5', value:'袁花社区巴士5号线'}, {display:'尖山1', value:'尖山社区巴士1号线'},
            {display:'尖山5', value:'尖山社区巴士5号线'}, {display:'尖山6', value:'尖山社区巴士6号线'}, {display:'尖山7', value:'尖山社区巴士7号线'},
            {display:'盐官1', value:'盐官社区巴士1号线'}, {display:'盐官2', value:'盐官社区巴士2号线'}, {display:'盐官3', value:'盐官社区巴士3号线'},
            {display:'周王庙1', value:'周王庙社区巴士1号线'}, {display:'周王庙2', value:'周王庙社区巴士2号线'}, {display:'周王庙3', value:'周王庙社区巴士3号线'},
            {display:'斜桥1', value:'斜桥社区巴士1号线'}, {display:'斜桥2', value:'斜桥社区巴士2号线'}, {display:'斜桥3', value:'斜桥社区巴士3号线'},
            {display:'丁桥1', value:'丁桥社区巴士1号线'}
        ],
        metro: [{display:'杭海城际', value:'杭海城际铁路'}]
    };

    // 检测设备类型并生成UI
    function createUI() {
        const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(navigator.userAgent.toLowerCase());
        const container = document.getElementById('container');

        if (isMobile) {
            // 移动端UI
            const mobileCard = document.createElement('div');
            mobileCard.className = 'input-card2';
            mobileCard.style.width = '18rem';
            mobileCard.innerHTML = `
                <label style='color:grey'>海宁公共交通线路查询</label>
                <div class='input-item2'>
                    <div class='input-item2-prepend'>
                        <span class='input-item2-text'>线路号码</span>
                    </div>
                    <input id='bln' type='text' value=''>
                </div>
                <input id='search' type='button' class='btn' value='查询'>
            `;
            document.body.appendChild(mobileCard);
        } else {
            // 桌面端UI
            const desktopCard = document.createElement('div');
            desktopCard.className = 'input-card';
            desktopCard.id = 'bus-query-card';
            desktopCard.style.width = '30rem';
            desktopCard.innerHTML = `
                <button class="collapse-btn" id="collapse-btn" title="折叠/展开"></button>
                <label style='color:grey'>海宁公共交通线路查询</label>
                ${generateBusCheckboxes('城市公交', busData.cityBuses, 'bid')}
                ${generateBusCheckboxes('城乡城际公交', busData.interBuses, 'bid')}
                ${generateBusCheckboxes('社区巴士', busData.communityBuses, 'bid')}
                ${generateBusCheckboxes('轨道交通', busData.metro, 'bid3')}
                <input id='search' type='button' class='btn' value='查询'>
            `;
            document.body.appendChild(desktopCard);
        }
    }

    // 生成复选框组
    function generateBusCheckboxes(title, buses, name) {
        const categoryId = title.replace(/\s+/g, '').toLowerCase();
        let html = `<div class='input-item'><div class='input-item-prepend' style='width:100%;'><span class='input-item-text category-header' data-category='${categoryId}'>&nbsp;&nbsp;${title}&nbsp;&nbsp;</span></div><br><br>`;
        buses.forEach(bus => {
            const display = bus.display || bus;
            const value = bus.value || bus;
            html += `<label><input type='checkbox' name='${name}' value='${value}' class='${categoryId}-checkbox' />${display}&nbsp;</label>&nbsp;`;
        });
        html += '</div>';
        return html;
    }

    // 全选/取消全选类别
    function toggleCategory(categoryId) {
        const checkboxes = document.querySelectorAll(`.${categoryId}-checkbox`);
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        
        checkboxes.forEach(checkbox => {
            checkbox.checked = !allChecked;
        });
    }

    // 折叠/展开组件
    function toggleCollapse() {
        const card = document.getElementById('bus-query-card');
        const collapseBtn = document.getElementById('collapse-btn');
        
        if (card.classList.contains('collapsed')) {
            card.classList.remove('collapsed');
            collapseBtn.title = '折叠';
        } else {
            card.classList.add('collapsed');
            collapseBtn.title = '展开';
        }
    }

    // 移除数组重复项
    function removeDuplicatedItem(arr) {
        return [...new Set(arr)];
    }

    // 初始化地图
    const map = new AMap.Map("container", {
        resizeEnable: true,
        mapStyle: 'amap://styles/macaron',
        features: ['bg', 'road', 'point'],
        center: [120.6803, 30.5115],
        zoom: 13
    });

    let district = null;
    let polygon;

    // 绘制边界
    function drawBounds() {
        if (!district) {
            const opts = {
                subdistrict: 0,
                extensions: 'all',
                level: 'district'
            };
            district = new AMap.DistrictSearch(opts);
        }
        district.setLevel('district');
        district.search('海宁市', (status, result) => {
            if (polygon) {
                map.remove(polygon);
                polygon = null;
            }
            const bounds = result.districtList[0].boundaries;
            if (bounds) {
                for (let i = 0; i < bounds.length; i++) {
                    bounds[i] = [bounds[i]];
                }
                polygon = new AMap.Polygon({
                    strokeWeight: 1,
                    path: bounds,
                    fillOpacity: 0.4,
                    fillColor: '#80d8ff',
                    strokeColor: '#0091ea'
                });
                map.add(polygon);
            }
        });
    }

    let linesearch;

    // 公交线路查询
    function lineSearch(type = 'local') {
        let check_val = [];
        map.clearMap();

        const nameMap = {
            local: 'bid',
            other: 'bid2',
            metro: 'bid3'
        };

        const elements = document.getElementsByName(nameMap[type]);
        for (let element of elements) {
            if (element.checked) {
                check_val.push(element.value);
            }
        }

        if (!linesearch) {
            linesearch = new AMap.LineSearch({
                pageIndex: 1,
                city: type === 'metro' ? '杭州' : '嘉兴',
                pageSize: type === 'local' ? 100 : 1,
                extensions: 'all'
            });
        }

        check_val = removeDuplicatedItem(check_val);
        check_val.forEach(busln => {
            let searchName = busln;
            if (type === 'local') {
                searchName = busln === '319' ? '319路' : '海宁' + busln;
            }
            linesearch.search(searchName, (status, result) => {
                if (status === 'complete' && result.info === 'OK') {
                    lineSearch_Callback(result);
                } else {
                    console.error('查询失败:', result);
                }
            });
        });
    }

    // 查询回调
    function lineSearch_Callback(data) {
        const lineArr = data.lineInfo;
        const lineNum = 4;
        if (lineNum === 0) return;

        const isSpecial = lineArr[0].name === '海盐K328路(宁观音桥--升界桥公交停车场)' || lineArr[0].name === '海盐K329路(兴隆村--升界桥公交停车场)';
        const startIndex = isSpecial ? 3 : 0;
        const endIndex = isSpecial ? lineNum : 1;

        for (let i = startIndex; i < endIndex; i++) {
            const pathArr = lineArr[i].path;
            const stops = lineArr[i].via_stops;
            const startPot = stops[0].location;
            const endPot = stops[stops.length - 1].location;

            drawbusLine(startPot, endPot, pathArr);

            const info = `
                <div class='content-window-card'>
                    <div style="padding:5px 0px 0px 0px;">
                        <h3>${lineArr[i].name}</h3>
                        <p class='input-item'>运营时间：${lineArr[i].stime}——${lineArr[i].etime}</p>
                        <p class='input-item'>票价：${lineArr[i].basic_price}元</p>
                    </div>
                </div>
            `;

            const infoWindow = new AMap.InfoWindow({
                content: info
            });
            infoWindow.open(map, [lineArr[i].path[0].lng, lineArr[i].path[0].lat]);
        }
    }

    // 生成随机颜色
    function getRandomColor() {
        const letters = '0123456789ABCDEF';
        let color = '#';
        for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
    }

    // 绘制公交线路
    function drawbusLine(startPot, endPot, BusArr) {
        const busPolyline = new AMap.Polyline({
            map: map,
            path: BusArr,
            strokeColor: getRandomColor(),
            strokeOpacity: 0.8,
            isOutline: true,
            outlineColor: 'white',
            strokeWeight: 2
        });
        map.setFitView();
    }

    // 运行查询
    function run() {
        drawBounds();
        lineSearch('local');
        lineSearch('other');
        lineSearch('metro');
    }

    // 初始化
    createUI();
    drawBounds();

    // 为类别标题和折叠按钮添加点击事件监听器
    document.addEventListener('click', (e) => {
        if (e.target.classList.contains('category-header')) {
            const categoryId = e.target.dataset.category;
            toggleCategory(categoryId);
        } else if (e.target.id === 'collapse-btn') {
            toggleCollapse();
        } else if (e.target.id === 'search') {
            run();
        }
    });
</script>
</body>
</html>
